<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background-color: #f2f4f3;
  color: #333;
}

.container {
  width: 90%;
  margin: 50px auto;
}

.cart-table {
  width: 100%;
  border-collapse: collapse;
  background-color: #f6f7f6;
  margin-bottom: 30px;
}

.cart-table th {
  text-align: left;
  padding: 15px;
  border-bottom: 2px solid #ccc;
  font-weight: 600;
}

.cart-table td {
  padding: 20px;
  text-align: left;
  border-bottom: 1px solid #ddd;
}

.cart-table img {
  width: 120px;
  border-radius: 8px;
}

.quantity-box {
  display: flex;
  align-items: center;
  gap: 8px;
}

.quantity-box button {
  background-color: #fff;
  border: 1px solid #ccc;
  padding: 5px 10px;
  cursor: pointer;
  transition: 0.3s;
}

.quantity-box button:hover {
  background-color: #000;
  color: #fff;
}

.quantity-box input {
  width: 40px;
  text-align: center;
  border: 1px solid #ccc;
  padding: 5px;
}

.remove {
  font-weight: bold;
  cursor: pointer;
  color: #000;
  transition: color 0.3s;
}

.remove:hover {
  color: red;
}

.cart-buttons {
  display: flex;
  justify-content: flex-start;
  gap: 20px;
  margin-top: 20px;
}

.update-btn,
.continue-btn {
  background-color: #2c2c2c;
  color: white;
  border: none;
  padding: 12px 25px;
  border-radius: 30px;
  cursor: pointer;
  transition: 0.3s;
}

.update-btn:hover,
.continue-btn:hover {
  background-color: #555;
}

.cart-totals {
  margin-top: 50px;
  max-width: 400px;
}

.cart-totals h3 {
  font-size: 22px;
  margin-bottom: 20px;
}

.totals-line {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
  font-size: 16px;
}

  </style>
</head>

<body>

  <section class="cart-section">
    <div class="container">
      <table class="cart-table">
        <thead>
          <tr>
            <th>Image</th>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Remove</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><img src="https://themewagon.github.io/furni/images/product-1.png" alt="Product 1"></td>
            <td>Product 1</td>
            <td>$49.00</td>
            <td class="quantity-box">
              <button class="minus">-</button>
              <input type="text" value="4">
              <button class="plus">+</button>
            </td>
            <td>$49.00</td>
            <td class="remove">x</td>
          </tr>

          <tr>
            <td><img src="https://themewagon.github.io/furni/images/product-2.png" alt="Product 2"></td>
            <td>Product 2</td>
            <td>$49.00</td>
            <td class="quantity-box">
              <button class="minus">-</button>
              <input type="text" value="1">
              <button class="plus">+</button>
            </td>
            <td>$49.00</td>
            <td class="remove">x</td>
          </tr>
        </tbody>
      </table>

      <div class="cart-buttons">
        <button class="update-btn">Update Cart</button>
        <button class="continue-btn">Continue Shopping</button>
      </div>

      <div class="cart-totals">
        <h3>CART TOTALS</h3>
        <div class="totals-line">
          <span>Subtotal:</span>
          <span>$320.00</span>
        </div>
        <div class="totals-line">
          <span>Total:</span>
          <span>$320.00</span>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
